<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="super-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="admin-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="readonly-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" fill="url(#bg-grad)" rx="12"/>
  <rect x="2" y="2" width="896" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10"/>

  <!-- Title Banner -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Role-Based Access Control (RBAC) Permission Matrix</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Administrative security tiers and operational permission boundaries</text>

  <!-- Card 1: Super Admin -->
  <g filter="url(#shadow)">
    <rect x="40" y="90" width="250" height="320" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" rx="8"/>
    <rect x="40" y="90" width="250" height="40" fill="url(#super-grad)" rx="8"/>
    <rect x="40" y="120" width="250" height="10" fill="url(#super-grad)"/>
    <text x="165" y="115" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Super Admin</text>

    <text x="165" y="150" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="600">Full System Control</text>

    <!-- Permission List -->
    <g font-family="sans-serif" font-size="12">
      <text x="60" y="185" fill="#10b981">✓ <tspan fill="#f8fafc">Dashboard Analytics View</tspan></text>
      <text x="60" y="215" fill="#10b981">✓ <tspan fill="#f8fafc">Message &amp; Inquiry Review</tspan></text>
      <text x="60" y="245" fill="#10b981">✓ <tspan fill="#f8fafc">Status &amp; Notes Editing</tspan></text>
      <text x="60" y="275" fill="#10b981">✓ <tspan fill="#f8fafc">Email Dispatch &amp; Replies</tspan></text>
      <text x="60" y="305" fill="#10b981">✓ <tspan fill="#f8fafc">CSV Data Export</tspan></text>
      <text x="60" y="335" fill="#10b981">✓ <tspan fill="#f8fafc" font-weight="700">Create &amp; Delete Users</tspan></text>
      <text x="60" y="365" fill="#10b981">✓ <tspan fill="#f8fafc" font-weight="700">Assign Account Roles</tspan></text>
    </g>

    <rect x="55" y="380" width="220" height="20" fill="#0f172a" stroke="#ef4444" stroke-width="1" rx="4"/>
    <text x="165" y="394" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="10" font-weight="700">Highest Privilege Level</text>
  </g>

  <!-- Card 2: Standard Admin -->
  <g filter="url(#shadow)">
    <rect x="325" y="90" width="250" height="320" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" rx="8"/>
    <rect x="325" y="90" width="250" height="40" fill="url(#admin-grad)" rx="8"/>
    <rect x="325" y="120" width="250" height="10" fill="url(#admin-grad)"/>
    <text x="450" y="115" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Standard Admin</text>

    <text x="450" y="150" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="600">Operations &amp; Content</text>

    <!-- Permission List -->
    <g font-family="sans-serif" font-size="12">
      <text x="345" y="185" fill="#10b981">✓ <tspan fill="#f8fafc">Dashboard Analytics View</tspan></text>
      <text x="345" y="215" fill="#10b981">✓ <tspan fill="#f8fafc">Message &amp; Inquiry Review</tspan></text>
      <text x="345" y="245" fill="#10b981">✓ <tspan fill="#f8fafc">Status &amp; Notes Editing</tspan></text>
      <text x="345" y="275" fill="#10b981">✓ <tspan fill="#f8fafc">Email Dispatch &amp; Replies</tspan></text>
      <text x="345" y="305" fill="#10b981">✓ <tspan fill="#f8fafc">CSV Data Export</tspan></text>
      <text x="345" y="335" fill="#ef4444">✗ <tspan fill="#94a3b8">User Management</tspan></text>
      <text x="345" y="365" fill="#ef4444">✗ <tspan fill="#94a3b8">Create/Delete Admin Users</tspan></text>
    </g>

    <rect x="340" y="380" width="220" height="20" fill="#0f172a" stroke="#3b82f6" stroke-width="1" rx="4"/>
    <text x="450" y="394" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="10" font-weight="700">Operational Tier</text>
  </g>

  <!-- Card 3: Read-Only Admin -->
  <g filter="url(#shadow)">
    <rect x="610" y="90" width="250" height="320" fill="#1e293b" stroke="#64748b" stroke-width="1.5" rx="8"/>
    <rect x="610" y="90" width="250" height="40" fill="url(#readonly-grad)" rx="8"/>
    <rect x="610" y="120" width="250" height="10" fill="url(#readonly-grad)"/>
    <text x="735" y="115" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Read-Only Admin</text>

    <text x="735" y="150" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Audit &amp; Reporting</text>

    <!-- Permission List -->
    <g font-family="sans-serif" font-size="12">
      <text x="630" y="185" fill="#10b981">✓ <tspan fill="#f8fafc">Dashboard Analytics View</tspan></text>
      <text x="630" y="215" fill="#10b981">✓ <tspan fill="#f8fafc">Message &amp; Inquiry Review</tspan></text>
      <text x="630" y="245" fill="#10b981">✓ <tspan fill="#f8fafc">CSV Data Export</tspan></text>
      <text x="630" y="275" fill="#ef4444">✗ <tspan fill="#94a3b8">Status &amp; Notes Editing</tspan></text>
      <text x="630" y="305" fill="#ef4444">✗ <tspan fill="#94a3b8">Email Dispatch &amp; Replies</tspan></text>
      <text x="630" y="335" fill="#ef4444">✗ <tspan fill="#94a3b8">Record Deletion</tspan></text>
      <text x="630" y="365" fill="#ef4444">✗ <tspan fill="#94a3b8">User Management</tspan></text>
    </g>

    <rect x="625" y="380" width="220" height="20" fill="#0f172a" stroke="#64748b" stroke-width="1" rx="4"/>
    <text x="735" y="394" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700">Restricted Read-Only Tier</text>
  </g>
</svg>
